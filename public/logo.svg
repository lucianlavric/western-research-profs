<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Background -->
  <rect width="40" height="40" rx="8" fill="#b8383b"/>

  <!-- Graduation Cap -->
  <polygon points="20,8 6,14 20,20 34,14" fill="#f5e6d3"/>
  <rect x="18" y="8" width="4" height="2" fill="#f5e6d3"/>
  <circle cx="20" cy="7" r="2" fill="#f5e6d3"/>

  <!-- Tassel -->
  <line x1="32" y1="14" x2="32" y2="22" stroke="#cf6a32" stroke-width="1.5"/>
  <circle cx="32" cy="23" r="2" fill="#cf6a32"/>

  <!-- Magnifying Glass (Research) -->
  <circle cx="16" cy="28" r="6" fill="none" stroke="#f5e6d3" stroke-width="2.5"/>
  <line x1="20.5" y1="32.5" x2="26" y2="38" stroke="#f5e6d3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- DNA Helix inside magnifying glass -->
  <path d="M13,25 Q16,27 19,25 M13,28 Q16,30 19,28 M13,31 Q16,29 19,31" fill="none" stroke="#b8383b" stroke-width="1" stroke-linecap="round"/>
