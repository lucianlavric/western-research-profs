<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Neubrutalist style logo -->

  <!-- Background with bold border -->
  <rect x="2" y="2" width="36" height="36" rx="6" fill="#ffd93d" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Graduation Cap - bold neubrutalist style -->
  <path d="M20 8 L6 16 L20 24 L34 16 Z" fill="#1a1a1a"/>
  <path d="M11 18 L11 26 Q20 32 29 26 L29 18" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tassel -->
  <line x1="32" y1="16" x2="32" y2="24" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="32" cy="26" r="2.5" fill="#ff5c5c" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Small decorative accent -->
  <circle cx="8" cy="32" r="3" fill="#6bcb77" stroke="#1a1a1a" stroke-width="1.5"/>
</svg>
