<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Western University Official Crest -->
  <defs>
    <clipPath id="shield">
      <path d="M20,10 L180,10 L180,140 Q180,200 100,230 Q20,200 20,140 Z"/>
    </clipPath>
  </defs>

  <!-- Shield Background -->
  <path d="M20,10 L180,10 L180,140 Q180,200 100,230 Q20,200 20,140 Z" fill="#4F2683" stroke="#4F2683" stroke-width="2"/>

  <!-- Sun burst at top -->
  <path d="M20,10 L180,10 L180,55 L20,55 Z" fill="#4F2683"/>
  <path d="M30,50 L40,25 L50,50 L60,25 L70,50 L80,25 L90,50 L100,25 L110,50 L120,25 L130,50 L140,25 L150,50 L160,25 L170,50" fill="none" stroke="white" stroke-width="3"/>

  <!-- White diagonal bands -->
  <path d="M20,55 L100,140 L20,140 Z" fill="white"/>
  <path d="M180,55 L100,140 L180,140 Z" fill="white"/>

  <!-- Center purple diamond -->
  <path d="M100,55 L150,105 L100,155 L50,105 Z" fill="#4F2683"/>

  <!-- Book with 1878 -->
  <rect x="80" y="65" width="40" height="30" fill="white" rx="2"/>
  <line x1="100" y1="65" x2="100" y2="95" stroke="#4F2683" stroke-width="1"/>
  <text x="90" y="82" font-family="serif" font-size="10" fill="#4F2683" text-anchor="middle">18</text>
  <text x="110" y="82" font-family="serif" font-size="10" fill="#4F2683" text-anchor="middle">78</text>

  <!-- Maple leaf at bottom -->
  <path d="M100,125 L105,135 L115,130 L110,140 L120,145 L108,150 L110,165 L100,158 L90,165 L92,150 L80,145 L90,140 L85,130 L95,135 Z" fill="white"/>

  <!-- Left circle (deer/stag) -->
  <circle cx="50" cy="105" r="18" fill="#4F2683"/>
  <text x="50" y="110" font-family="serif" font-size="14" fill="white" text-anchor="middle">🦌</text>

  <!-- Right circle (lion) -->
  <circle cx="150" cy="105" r="18" fill="#4F2683"/>
  <text x="150" y="110" font-family="serif" font-size="14" fill="white" text-anchor="middle">🦁</text>
</svg>
