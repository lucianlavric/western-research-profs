<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>
  <!-- Niyasv style: gradient blue background, rounded corners, professional -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- White R with soft shadow -->
  <text x="256" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="320" font-weight="700" fill="white" text-anchor="middle" filter="url(#shadow)">R</text>
</svg>
