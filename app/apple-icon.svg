<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#845ef7"/>
      <stop offset="100%" style="stop-color:#339af0"/>
    </linearGradient>
  </defs>
  <!-- Arc Browser style: vibrant gradient, very rounded, playful -->
  <rect width="180" height="180" rx="50" fill="url(#arc)"/>
  <!-- White R -->
  <text x="90" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="700" fill="white" text-anchor="middle">R</text>
</svg>
