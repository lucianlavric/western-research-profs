<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#635bff"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="white" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stripe style: mesh gradient background, sophisticated fintech feel -->
  <rect width="180" height="180" rx="30" fill="url(#mesh)"/>
  <!-- White R with subtle glow -->
  <text x="90" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="600" fill="white" text-anchor="middle" filter="url(#glow)">R</text>
</svg>
