<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Pentagram editorial style: white background, black serif R, minimal border -->
  <rect width="180" height="180" rx="0" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- Black R in serif font (Georgia) -->
  <text x="90" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="400" fill="#000" text-anchor="middle">R</text>
</svg>
